[package]
name = "zotero-semantic"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Semantic search, embedding generation, chunk storage, and vector similarity search for Zotero libraries"
readme = "../../README.md"
repository.workspace = true
license.workspace = true
keywords = ["bibliography", "embeddings", "zotero"]
categories = ["api-bindings"]

[dependencies]
fastembed.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, default-features = false, features = [
  "runtime-tokio",
  "sqlite",
] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zotero-api = { workspace = true, features = ["sqlite"] }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
zotero-api = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
